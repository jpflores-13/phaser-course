<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cold Chain</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1e2530;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* phones held upright get a hint instead of a tiny game */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        color: #e2e8f0;
        font: 600 18px system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
        #game {
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Turn your phone sideways to play.</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
